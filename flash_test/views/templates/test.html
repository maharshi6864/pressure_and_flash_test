{% extends "base.html" %}

{% block content %}
<div class="row g-4">
    <div class="col-lg-9">
        <div class="card border-0 h-100">
            <div
                class="card-body p-0 d-flex align-items-center justify-content-center overflow-hidden ratio ratio-16x9 rounded">
                <img src="/video_feed/test" alt="Test Feed" class="object-fit-contain w-100 h-100">
            </div>
            <div class="card bg-light my-3">
                <div class="card-body p-3">
                    <div class="row">
                        <div class="col-12">
                            <div class="">
                                <div class="text-secondary small text-uppercase fw-bold mb-1">Flash Detected</div>
                                <div id="val-current" class="fs-2 fw-bold text-dark lh-1 mb-1">No</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-3">
        <div class="card border-0 h-100 p-0">
            <div class="card-body p-0 d-flex flex-column" style="max-height: 95vh; overflow-y: auto;">
                <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
                    <h4 class="card-title fw-bold mb-0 text-primary d-flex align-items-center gap-2">
                        <span class="material-symbols-outlined">bolt</span> Flash Test
                    </h4>
                    <img src="/static/images/c4i4-logo-1.png" alt="Logo" class="img-fluid" style="max-height: 38px;">
                </div>

                <div class="mb-3 p-3 bg-light rounded border border-secondary-subtle">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="text-secondary small fw-bold text-uppercase mb-0">Proof & Test Selection</h6>
                        <button id="refreshProofsBtn" type="button"
                            class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1 py-1 px-2"
                            title="Fetch latest proofs">
                            <span class="material-symbols-outlined fs-6">refresh</span>
                            <span class="small">Refresh</span>
                        </button>
                    </div>
                    <div class="mb-2">
                        <label for="proofSelect" class="form-label small mb-1">Select Proof (Lot No)</label>
                        <select id="proofSelect" class="form-select form-select-sm">
                            <option value="">-- Select Proof --</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label for="testSelect" class="form-label small mb-1">Select Test</label>
                        <select id="testSelect" class="form-select form-select-sm" disabled>
                            <option value="">-- Select Test --</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <button id="readyBtn"
                        class="btn btn-success w-100 fs-6 py-2 d-flex justify-content-center align-items-center gap-2 mb-3">
                        <span class="material-symbols-outlined">thumb_up</span> Ready
                    </button>
                    <button id="saveMeasurementBtn"
                        class="btn btn-success w-100 fs-6 py-2 d-flex justify-content-center align-items-center gap-2"
                        disabled>
                        <span class="material-symbols-outlined">save</span> Save Results
                    </button>
                </div>

                <div id="measureMessage" class="mt-3 text-center small fw-bold"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/test.js"></script>
{% endblock %}
