{% extends "base.html" %}

{% block content %}
<div class="row g-2">
    <div class="col-lg-4">
        <div class="card border-0">
            <div
                class="card-body p-0 d-flex align-items-center justify-content-center overflow-hidden ratio ratio-16x9 rounded">
                <img src="/video_feed/test" alt="Test Feed" class="object-fit-contain w-100">
            </div>
            <div class="card bg-light my-2 shadow-sm border-0">
                <div class="card-body p-3">
                    <div class="row">
                        <div class="col-12">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-secondary small text-uppercase fw-bold mb-1">Flash Detected</div>
                                    <div id="val-current" class="fs-2 fw-bold text-dark lh-1 mb-1">No</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-8">
        <div class="card border-0 h-100 p-0">
            <div class="card-body p-0 d-flex flex-column" style="max-height: 95vh; overflow-y: auto;">
                <div class="d-flex align-items-center justify-content-between mb-3 pb-2 border-bottom">
                    <h4 class="card-title fw-bold mb-0 text-primary d-flex align-items-center gap-2">
                        <span class="material-symbols-outlined">bolt</span> Flash Test
                    </h4>
                    <img src="/static/images/c4i4-logo-1.png" alt="Logo" class="img-fluid" style="max-height: 38px;">
                </div>

                <!-- Proof Selection Card -->
                <div class="mb-3 p-3 bg-light rounded border border-secondary-subtle shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label for="proofSelect" class="form-label small fw-bold text-uppercase text-secondary mb-0">Select Proof (Lot No)</label>
                        <button id="refreshProofsBtn" type="button"
                            class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1 py-1 px-2"
                            title="Fetch latest proofs">
                            <span class="material-symbols-outlined fs-6">refresh</span>
                            <span class="small">Refresh</span>
                        </button>
                    </div>
                    <select id="proofSelect" class="form-select form-select-sm">
                        <option value="">-- Select Proof --</option>
                    </select>
                </div>

                <!-- Test Cards Grid Section -->
                <div class="mb-3 p-3 bg-light rounded border border-secondary-subtle shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="text-secondary small fw-bold text-uppercase mb-0">Tests Overview</h6>
                        <span id="testsSummaryBadge" class="badge bg-secondary-subtle text-secondary small">0 / 0 Completed</span>
                    </div>
                    <div id="testCardsContainer" class="row row-cols-2 row-cols-sm-3 row-cols-md-5 g-2">
                        <div class="col-12 w-100 text-center text-muted py-3">
                            <small>Select a proof to display test cards</small>
                        </div>
                    </div>
                </div>

                <!-- Action Controls -->
                <div class="mb-2">
                    <div class="row g-2">
                        <div class="col-6">
                            <button id="readyBtn"
                                class="btn btn-success w-100 fs-6 py-2 d-flex justify-content-center align-items-center gap-2 shadow-sm">
                                <span class="material-symbols-outlined">thumb_up</span> Ready
                            </button>
                        </div>
                        <div class="col-6">
                            <button id="saveMeasurementBtn"
                                class="btn btn-success w-100 fs-6 py-2 d-flex justify-content-center align-items-center gap-2 shadow-sm"
                                disabled>
                                <span class="material-symbols-outlined">save</span> Save Results
                            </button>
                        </div>
                    </div>
                </div>

                <div id="measureMessage" class="mt-2 text-center small fw-bold" style="min-height: 20px;"></div>
            </div>
        </div>
    </div>
</div>

<!-- Flash Image Preview Modal -->
<div class="modal fade" id="flashImageModal" tabindex="-1" aria-labelledby="flashImageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-light py-2">
                <h5 class="modal-title fs-6 fw-bold d-flex align-items-center gap-2 text-primary" id="flashImageModalLabel">
                    <span class="material-symbols-outlined">image</span> <span id="flashModalTitle">Flash Detection Image</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center p-2 bg-dark rounded-bottom position-relative">
                <div class="d-flex justify-content-center align-items-center" style="min-height: 320px; max-height: 70vh;">
                    <img id="flashModalImg" src="" alt="Flash Image Preview" class="img-fluid rounded object-fit-contain shadow" style="max-height: 68vh;">
                </div>
                <div id="flashModalCaption" class="text-white-50 small mt-2"></div>
            </div>
            <div class="modal-footer py-2 bg-light justify-content-between">
                <span id="flashModalTime" class="text-secondary small fw-semibold"></span>
                <div class="d-flex gap-2">
                    <a id="flashModalDownloadBtn" href="#" download class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1 shadow-sm">
                        <span class="material-symbols-outlined fs-6">download</span> Download
                    </a>
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/test.js"></script>
{% endblock %}
