<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Test App</title>
    <link rel="icon" type="image/png" href="/static/images/favicon-32x32_ver-1.1.png">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/material-symbols.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            /* background-color: #f8f9fa; */
            /* Light background */
        }

        .sidebar {
            width: 250px;
            background-color: #ffffff;
            /* White sidebar */
            border-right: 1px solid #dee2e6;
            padding: 2rem 1.5rem;
            z-index: 1000;
        }

        .video-feed {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background-color: #000;
            border-radius: 0.5rem;
        }

        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
</head>

<body class="d-flex min-vh-100 m-0">
   
    <main class="main-content flex-grow-1 p-2" style="margin-left:  0px;">
        <div class="container-fluid h-100">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
