<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Proof Server</title>
    <link rel="icon" type="image/png" href="/static/images/favicon-32x32_ver-1.1.png">
    <link rel="shortcut icon" href="/static/images/favicon.ico">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/material-symbols.css">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-color: white;
        }
        .brand-logo {
            max-height: 65px;
            max-width: 80%;
            object-fit: contain;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <img src="/static/images/c4i4-logo-1.png" alt="C4i4 Logo" class="brand-logo">
        <h3 class="mb-4 fw-bold text-secondary">Central Proof Server</h3>
        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username" required>
                <label for="username">Username</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <label for="password">Password</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Sign In</button>
            <div id="errorMessage" class="text-danger small d-none">Invalid credentials.</div>
        </form>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
