<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Proof Server</title>
    <link rel="icon" type="image/png" href="/static/images/favicon-32x32_ver-1.1.png">
    <link rel="shortcut icon" href="/static/images/favicon.ico">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/material-symbols.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background-color: #f8f9fa;
            /* Light background */
        }

        .sidebar {
            width: 250px;
            background-color: #ffffff;
            /* White sidebar */
            border-right: 1px solid #dee2e6;
            padding: 1.5rem 1.25rem;
            z-index: 1000;
        }

        .video-feed {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background-color: #000;
            border-radius: 0.5rem;
        }

        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
</head>

<body class="d-flex min-vh-100 m-0">
    <!-- Sidebar -->
    <aside class="sidebar d-flex flex-column h-100 position-fixed shadow-sm">
        <div class="text-center mb-2">
            <img src="/static/images/c4i4-logo-1.png" alt="C4i4 Logo" class="img-fluid"
                style="max-height: 48px; object-fit: contain;">
            <div class="text-primary fw-bold fs-5 mt-1">ProofServer</div>
        </div>
        <hr class="my-2">
        <ul class="nav nav-pills flex-column gap-2 mb-auto">
            <li class="nav-item">
                <a href="/manage-proofs"
                    class="nav-link px-3 d-flex align-items-center gap-2 {% if request.url.path == '/' or request.url.path == '/manage-proofs' or request.url.path.startswith('/proof/') %}active{% else %}text-dark{% endif %}">
                    <span class="material-symbols-outlined">inventory_2</span> Manage Proofs
                </a>
            </li>
            <li class="nav-item d-none" id="navManageUsers">
                <a href="/manage-users"
                    class="nav-link px-3 d-flex align-items-center gap-2 {% if request.url.path == '/manage-users' %}active{% else %}text-dark{% endif %}">
                    <span class="material-symbols-outlined">manage_accounts</span> Manage Users
                </a>
            </li>
            <li class="nav-item mt-2">
                <a href="/login" class="nav-link px-3 d-flex align-items-center gap-2 text-danger" id="logoutBtn">
                    <span class="material-symbols-outlined">logout</span> Logout
                </a>
            </li>
        </ul>
        <div class="mt-auto card bg-light border-secondary-subtle d-none" id="userProfile">
            <div class="card-body p-2 d-flex align-items-center gap-2">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 34px; height: 34px; font-weight: bold;" id="userAvatar">
                    <span class="material-symbols-outlined fs-5">person</span>
                </div>
                <div class="flex-grow-1 text-truncate">
                    <div class="fw-bold small text-truncate text-dark" id="userNameDisplay">User</div>
                    <div class="d-flex align-items-center gap-1">
                        <small class="text-muted" style="font-size: 11px;" id="usernameDisplay">@admin</small>
                        <span class="badge bg-secondary" style="font-size: 9px; text-transform: uppercase;" id="userRoleBadge">User</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content flex-grow-1 p-4" style="margin-left: 250px;">
        <div class="container-fluid h-100">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
    <script>
        // Global Auth & Navigation Guard
        (function() {
            const token = localStorage.getItem("token");
            const role = localStorage.getItem("role");
            const username = localStorage.getItem("username");
            const name = localStorage.getItem("name");

            if (!token && window.location.pathname !== "/login") {
                window.location.href = "/login";
                return;
            }

            // Show Manage Users menu only for admin
            const navUsers = document.getElementById("navManageUsers");
            if (navUsers && role === "admin") {
                navUsers.classList.remove("d-none");
            }

            // Populate profile badge
            const up = document.getElementById("userProfile");
            if (up && token) {
                up.classList.remove("d-none");
                const und = document.getElementById("userNameDisplay");
                if (und) und.innerText = name || username || "User";
                const ud = document.getElementById("usernameDisplay");
                if (ud) ud.innerText = username ? `@${username}` : '';
                const rb = document.getElementById("userRoleBadge");
                if (rb) {
                    rb.innerText = role || "user";
                    if (role === "admin") {
                        rb.className = "badge bg-primary";
                    } else {
                        rb.className = "badge bg-secondary";
                    }
                }
            }

            // Global Logout
            const logoutBtn = document.getElementById("logoutBtn");
            if (logoutBtn) {
                logoutBtn.onclick = function(e) {
                    e.preventDefault();
                    localStorage.removeItem("token");
                    localStorage.removeItem("role");
                    localStorage.removeItem("username");
                    localStorage.removeItem("name");
                    window.location.href = "/login";
                };
            }
        })();
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
