{% extends "base.html" %}

{% block content %}
<div class="row g-4">
    <div class="col-lg-4">
        <div class="card border-0">
            <div
                class="card-body p-0 d-flex align-items-center justify-content-center overflow-hidden ratio ratio-16x9 rounded">
                <img src="/video_feed/test" alt="Test Feed" class="object-fit-contain w-100">
            </div>
            <div class="row">
                <div class="col-6">
                    <div class="card bg-light my-3">
                        <div class="card-header">
                            Current Values
                        </div>
                        <div class="card-body p-3">
                            <div class="row">
                                <div class="col-12">
                                    <div class="">
                                        <div class="text-secondary small text-uppercase fw-bold mb-1">Current X</div>
                                        <div id="val-current-inch" class="fs-6 text-dark lh-1 mb-1 fw-semibold">0 inch
                                        </div>
                                        <div id="val-current-press" class="small text-secondary font-monospace">
                                            MPA:
                                            0.000</div>
                                    </div>
                                </div>
                                <!-- <div class="col-6">
                                    <div class="">
                                        <div class="text-secondary small text-uppercase fw-bold mb-1">Max +ve</div>
                                        <div id="val-max-pos-inch" class="fs-6 text-dark lh-1 mb-1 fw-semibold">0 inch
                                        </div>
                                        <div id="val-max-pos-press" class="small text-secondary font-monospace">
                                            MPA:
                                            0.000</div>
                                    </div>
                                </div> -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card bg-light my-3">
                        <div class="card-header">
                            Recorded Values
                        </div>
                        <div class="card-body p-3">
                            <div class="row">
                                <div class="col-12">
                                    <div class="">
                                        <div class="text-secondary small text-uppercase fw-bold mb-1">Max +ve</div>
                                        <div id="rec-val-max-pos-inch" class="fs-6 text-dark lh-1 mb-1 fw-semibold">0
                                            inch
                                        </div>
                                        <div id="rec-val-max-pos-press" class="small text-secondary font-monospace">
                                            MPA:
                                            0.000</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card border-0">
            <div class="mb-3">
                <button id="setOriginBtn"
                    class="btn btn-primary w-100 fs-6 py-2 d-flex justify-content-center align-items-center gap-2">
                    <span class="material-symbols-outlined">my_location</span> Set Origin (Current X)
                </button>
            </div>

            <div class="mb-3">
                <button id="resetBtn"
                    class="btn btn-danger w-100 fs-6 py-2 d-flex justify-content-center align-items-center gap-2">
                    <span class="material-symbols-outlined">delete</span> Reset Recorded Values
                </button>
            </div>

            <div class="mb-3">
                <button id="saveMeasurementBtn"
                    class="btn btn-success w-100 fs-6 py-2 d-flex justify-content-center align-items-center gap-2"
                    disabled>
                    <span class="material-symbols-outlined">save</span> Save Results And Next Test
                </button>
            </div>
        </div>
    </div>

    <div class="col-lg-8">
        <div class="card border-0 h-100 p-0">
            <div class="card-body p-0 d-flex flex-column" style="max-height: 95vh; overflow-y: auto;">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h4 class="card-title fw-bold mb-0 text-primary d-flex align-items-center gap-2">
                        <span class="material-symbols-outlined">speed</span> Pressure Test
                    </h4>
                    <img src="/static/images/c4i4-logo-1.png" alt="Logo" style="height: 34px; object-fit: contain;">
                </div>

                <!-- Proof Selection Card -->
                <div class="mb-3 p-3 bg-light rounded border border-secondary-subtle shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label for="proofSelect" class="form-label small fw-bold text-uppercase text-secondary mb-0">Select Proof (Lot No)</label>
                        <button id="refreshProofsBtn" type="button"
                            class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1 py-1 px-2"
                            title="Fetch latest proofs">
                            <span class="material-symbols-outlined" style="font-size: 1.1rem;">refresh</span>
                            <span class="small">Refresh</span>
                        </button>
                    </div>
                    <select id="proofSelect" class="form-select form-select-sm">
                        <option value="">-- Select Proof --</option>
                    </select>
                </div>

                <!-- Test Cards Grid Section -->
                <div class="mb-3 p-3 bg-light rounded border border-secondary-subtle shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="text-secondary small fw-bold text-uppercase mb-0">Tests Overview</h6>
                        <span id="testsSummaryBadge" class="badge bg-secondary-subtle text-secondary small">0 / 0 Completed</span>
                    </div>
                    <div id="testCardsContainer" class="row row-cols-2 row-cols-sm-3 row-cols-md-5 g-2">
                        <div class="col-12 w-100 text-center text-muted py-4">
                            <span class="material-symbols-outlined fs-2 text-secondary opacity-50 mb-1">inventory_2</span>
                            <p class="small mb-0">Select a proof to display test cards</p>
                        </div>
                    </div>
                </div>

                <div id="measureMessage" class="mt-2 text-center small fw-bold" style="min-height: 20px;"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/test.js"></script>
{% endblock %}
